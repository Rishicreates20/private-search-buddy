# Local, private SearXNG instance for Veilo's backend to query.
# Setup: cp settings.example.yml settings.yml, then replace secret_key
# with a real random value (e.g. `openssl rand -hex 32`).
# Run:    docker compose up -d   (from this directory)
# Then set SEARXNG_URL=http://localhost:8888 in the project's .env.
name: veilo-searxng

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: veilo-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
